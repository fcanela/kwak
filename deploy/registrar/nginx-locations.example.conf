# The two kwak locations for the reverse proxy's Matrix site (spec 11 step 7). They go inside the
# server block that serves your Matrix server name, before its catch-all `location /`.
#
# They use a rate limit zone named matrix_auth. Define it once in the http block, for POSTs only:
#
#   map $request_method $matrix_auth_key { POST $binary_remote_addr; default ""; }
#   limit_req_zone $matrix_auth_key zone=matrix_auth:10m rate=30r/m;
#
# proxy_pass has no URI part, and X-Forwarded-For is overwritten, never appended. 192.0.2.12:8010
# is the registrar's listener API on the Matrix host. Route nothing else to the registrar.

# The only route that needs no key. It keeps one rate limit (DV-11).
location = /_kwak/v1/pair {
  limit_req zone=matrix_auth burst=10 nodelay; limit_req_status 429;
  client_max_body_size 64k;
  proxy_pass http://192.0.2.12:8010; proxy_http_version 1.1;
  proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 30s; }

# Everything else under /_kwak/v1/. No limit: /pair/claim is a long poll and /agents takes bursts.
location ^~ /_kwak/v1/ {
  client_max_body_size 64k;
  proxy_pass http://192.0.2.12:8010; proxy_http_version 1.1;
  proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 60s; }
